name: Dataset Source Validation

on:
  push:
    branches: [main, master, "feature/**"]
    paths:
      - "backend/config.py"
      - "backend/retrieval/data_providers/catalog.py"
      - "backend/retrieval/sources/**"
      - "backend/validation/**"
      - "backend/scripts/validate_dataset_sources.py"
      - ".github/workflows/dataset-source-validation.yml"
  pull_request:
    paths:
      - "backend/config.py"
      - "backend/retrieval/data_providers/catalog.py"
      - "backend/retrieval/sources/**"
      - "backend/validation/**"
      - "backend/scripts/validate_dataset_sources.py"
      - ".github/workflows/dataset-source-validation.yml"
  schedule:
    # Nightly health check for upstream dataset URLs
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate-sources:
    name: Validate dataset sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pytest

      - name: Unit tests (validation)
        run: |
          python -m pytest tests/test_dataset_source_validation.py -q --tb=short

      - name: Validate configured dataset sources
        env:
          # Use ephemeral DB so registry collection does not depend on local memory.db
          DATABASE_URL: sqlite:///./ci_memory.db
        run: |
          # Fails only on critical downloadable origins (config/catalog/github/world_bank).
          # Discovery catalog_page links are advisory and do not gate the build.
          python backend/scripts/validate_dataset_sources.py \
            --no-registry \
            --timeout 25 \
            --output-dir data/validation_reports \
            --fail-on-broken

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-source-validation-report
          path: data/validation_reports/
          if-no-files-found: ignore
